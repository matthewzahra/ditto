server {
    listen 80;

    client_max_body_size 10M; # allow files up to 10 MB in size

    # if too big, respond with json and not the default html
    error_page 413 = /413.json;
    location = /413.json {
        internal;
        default_type application/json;
        return 413 '{"error":"File too large","detail":"The uploaded file must be 10 MB or smaller."}';
    }

    # React frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html; # Vite should build index.html for us - it is called when we run npm run build
    }

    # Django API
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # hardcoded as tailscale funnel will deal with encryption
    }

    # Django Channels / WebSockets
    location /ws/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # hardcoded as tailscale funnel will deal with encryption
		proxy_read_timeout 3600s; # keep websockets open for at least an hour of inactivity
    }
}